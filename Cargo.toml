[workspace]
resolver = "2"
members = ["crates/*", "verify"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Bogdan Sivochkin <sivo4kin@gmail.com>"]
repository = "https://github.com/sivo4kin/tron-rs"
rust-version = "1.90"

[workspace.dependencies]
# internal crates
tron-types = { path = "crates/types" }
tron-crypto = { path = "crates/crypto" }
tron-proto = { path = "crates/proto" }
tron-storage = { path = "crates/storage" }
tron-state = { path = "crates/state" }
tron-chain = { path = "crates/chain" }
tron-actuators = { path = "crates/actuators" }
tron-vm = { path = "crates/vm" }
tron-consensus = { path = "crates/consensus" }
tron-p2p = { path = "crates/p2p" }
tron-rpc = { path = "crates/rpc" }

# external
thiserror = "1"
anyhow = "1"
hex = "0.4"
bs58 = "0.5"
sha2 = "0.10"
sha3 = "0.10"
secp256k1 = { version = "0.29", features = ["recovery"] }
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-build = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"
