[package]
name = "tron-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Differential verification harness: captures live-chain fixtures from a java-tron node and asserts tron-rs parity against them (SPEC section 7)."

[[bin]]
name = "capture"
path = "src/bin/capture.rs"

[dependencies]
tron-proto.workspace = true
tron-chain.workspace = true
tron-crypto.workspace = true
tron-consensus.workspace = true
tron-p2p.workspace = true
tron-rpc.workspace = true
tron-types.workspace = true
tron-actuators.workspace = true
tron-state.workspace = true
tron-storage.workspace = true
prost.workspace = true
prost-types.workspace = true
tonic.workspace = true
tokio.workspace = true
anyhow.workspace = true
hex.workspace = true
serde_json = "1"
# Archive JSON-RPC probe (eth_getStorageAt). Uses the workspace reqwest feature set;
# reaching an HTTPS archive endpoint additionally needs a TLS backend enabled in the
# build (documented — moot for public TronGrid, which is latest-only anyway).
reqwest.workspace = true
